function L(en, fr){ return lang === "fr" ? fr : en; }
function dot(s){ return lang === "fr" ? String(s).replace(".", ",") : String(s); }
function pct(x){ var s = (typeof x === "number" && x % 1 !== 0) ? x.toFixed(1) : String(x); return dot(s) + (lang === "fr" ? " %" : "%"); }
function intc(n){ try{ return n.toLocaleString(lang === "fr" ? "fr-CA" : "en-CA"); }catch(e){ return String(n); } }
function money(v){ var r = Math.round(v), t; try{ t = r.toLocaleString(lang === "fr" ? "fr-CA" : "en-CA"); }catch(e){ t = String(r); } return lang === "fr" ? (t + " $") : ("$" + t); }
function moneyK(v){ return lang === "fr" ? (Math.round(v/1000) + " k$") : ("$" + Math.round(v/1000) + "K"); }
function kpi(v, l){ return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }

function srTable(caption, headers, rows){
  var head = headers.map(function(h, i){ return '<th scope="col"'+(i ? ' class="num"' : '')+'>'+h+'</th>'; }).join("");
  var body = rows.map(function(r){
    return '<tr><th scope="row">'+r[0]+'</th>'+r.slice(1).map(function(c){ return '<td class="num">'+c+'</td>'; }).join("")+'</tr>';
  }).join("");
  return '<div class="sr-only"><table><caption>'+caption+'</caption><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}

function svgBars(values, xlabels, opts){
  opts = opts || {};
  var w = 560, h = 158, padL = 8, padT = 16, padB = 28, n = values.length;
  var mx = opts.max != null ? opts.max : Math.max.apply(null, values) * 1.18;
  var gap = (w - 2*padL) / n, bw = gap * 0.6, bars = "", lab = "";
  for(var i = 0; i < n; i++){
    if(values[i] == null) continue;
    var x = padL + i*gap + (gap - bw)/2, bh = (h - padT - padB) * (values[i]/mx), y = h - padB - bh;
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(opts.color || "var(--black)")+'"/>';
  }
  [0, n-1].forEach(function(i){
    if(values[i] == null) return;
    var x = padL + i*gap + gap/2, y = h - padB - (h - padT - padB)*(values[i]/mx) - 4;
    lab += '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="11" fill="var(--ink-soft)" text-anchor="middle">'+pct(values[i])+'</text>';
  });
  var xt = [0, Math.floor((n-1)/2), n-1].map(function(i){
    var x = padL + i*gap + gap/2;
    return '<text x="'+x.toFixed(1)+'" y="'+(h-9)+'" font-size="10" fill="var(--ink-soft)" text-anchor="middle">'+xlabels[i]+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="auto" role="img" aria-label="'+(opts.aria||"")+'"><line x1="'+padL+'" y1="'+(h-padB)+'" x2="'+(w-padL)+'" y2="'+(h-padB)+'" stroke="var(--line)"/>'+bars+lab+xt+'</svg>';
}

function svgLines(series, xlabels, opts){
  opts = opts || {};
  var w = 560, h = opts.h || 215, padL = 46, padR = opts.padR || 92, padT = 14, padB = 28, n = xlabels.length;
  var allv = [];
  series.forEach(function(s){ s.values.forEach(function(v){ if(v != null) allv.push(v); }); });
  if(opts.refLine != null) allv.push(opts.refLine);
  var mn = opts.min != null ? opts.min : Math.min.apply(null, allv);
  var mx = opts.max != null ? opts.max : Math.max.apply(null, allv);
  var pad = (mx - mn) * 0.12 || 1;
  if(opts.min == null) mn -= pad;
  if(opts.max == null) mx += pad;
  function X(i){ return padL + (w - padL - padR) * (n <= 1 ? 0 : i/(n-1)); }
  function Y(v){ return padT + (h - padT - padB) * (1 - (v - mn)/((mx - mn) || 1)); }
  var g = "";
  if(opts.refLine != null){
    var ry = Y(opts.refLine);
    g += '<line x1="'+padL+'" y1="'+ry.toFixed(1)+'" x2="'+(w-padR).toFixed(1)+'" y2="'+ry.toFixed(1)+'" stroke="var(--ink-soft)" stroke-dasharray="4 3" stroke-width="1"/>'
       + '<text x="'+(w-padR+4).toFixed(1)+'" y="'+(ry+3).toFixed(1)+'" font-size="10" fill="var(--ink-soft)">'+(opts.refLabel||"")+'</text>';
  }
  series.forEach(function(s){
    var pts = s.values.map(function(v, i){ return v == null ? null : (X(i).toFixed(1)+","+Y(v).toFixed(1)); }).filter(Boolean);
    g += '<polyline fill="none" stroke="'+s.color+'" stroke-width="2.2" points="'+pts.join(" ")+'"/>';
    s.values.forEach(function(v, i){ if(v != null) g += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.3" fill="'+s.color+'"/>'; });
    var li = s.values.length - 1; while(li >= 0 && s.values[li] == null) li--;
    if(li >= 0) g += '<text x="'+(X(li)+5).toFixed(1)+'" y="'+(Y(s.values[li])+3).toFixed(1)+'" font-size="10.5" fill="'+s.color+'">'+s.label+'</text>';
  });
  [mn, (mn+mx)/2, mx].forEach(function(v){
    g += '<text x="'+(padL-6)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="9.5" fill="var(--ink-soft)" text-anchor="end">'+(opts.yfmt ? opts.yfmt(v) : Math.round(v))+'</text>';
  });
  [0, Math.floor((n-1)/2), n-1].forEach(function(i){
    g += '<text x="'+X(i).toFixed(1)+'" y="'+(h-9)+'" font-size="9.5" fill="var(--ink-soft)" text-anchor="middle">'+xlabels[i]+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="auto" role="img" aria-label="'+(opts.aria||"")+'">'+g+'</svg>';
}

function svgFunnel(){

  var w = 560, rowH = 34, pad = 8, labelW = 118, max = 7.0, barMax = w - labelW - 60, rows = "";
  stages.forEach(function(s, i){
    var y = pad + i*rowH, bw = barMax * (s[1]/max);
    rows += '<text x="0" y="'+(y + rowH/2 + 4)+'" font-size="13" fill="var(--ink)">'+s[0]+'</text>'
          + '<rect x="'+labelW+'" y="'+(y+7)+'" width="'+bw.toFixed(1)+'" height="'+(rowH-16)+'" rx="3" fill="var(--black)"/>'
          + '<text x="'+(labelW + bw + 7).toFixed(1)+'" y="'+(y + rowH/2 + 4)+'" font-size="12.5" fill="var(--ink-soft)">'+pct(s[1])+'</text>';
  });
  var h = pad*2 + stages.length*rowH;
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="auto" role="img" aria-label="'+L("Black employees as a share of hires, the workforce, promotions, and executives.","Les employ\u00e9s noirs en proportion des embauches, de l'effectif, des promotions et des cadres.")+'">'+rows+'</svg>';
}

function dataTable(caption, head, rows){
  return '<div class="tblwrap"><table><caption>'+caption+'</caption><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function regionTable(){

  var rows = rs.map(function(r){
    return '<tr><th scope="row">'+(lang === "fr" ? r[3] : r[0])+'</th><td class="num">'+intc(r[1])+'</td><td class="num">'+(r[2] == null ? L("suppressed","supprim\u00e9") : pct(r[2]))+'</td></tr>';
  }).join("");
  var head = '<th scope="col">'+L("Region","R\u00e9gion")+'</th><th scope="col" class="num">'+L("Employees","Employ\u00e9s")+'</th><th scope="col" class="num">'+L("Black share","Part noire")+'</th>';
  return dataTable(L("Black share of employees by region, March 31, 2025.","Part des employ\u00e9s noirs par r\u00e9gion, 31 mars 2025."), head, rows);
}

function occTable(){
  var os = DATA.occ.slice().sort(function(a, b){ return b[2] - a[2]; });

    return '<tr><th scope="row">'+(lang === "fr" ? r[3] : r[0])+'</th><td class="num">'+intc(r[1])+'</td><td class="num">'+pct(r[2])+'</td></tr>';
  }).join("");

}

function funnelTable(){
  var stages = lang === "fr" ? DATA.funnel.stagesFr : DATA.funnel.stages;
  var head = '<th scope="col">'+L("Group","Groupe")+'</th>'
    + stages.map(function(s){ return '<th scope="col" class="num">'+s+'</th>'; }).join("")
    + '<th scope="col" class="num">'+L("Survival ratio","Ratio de survie")+'</th>';
  var rows = DATA.funnel.rows.map(function(r){
    var name = lang === "fr" ? r[1] : r[0], cls = r[4] === "black" ? ' class="hl"' : '';
    return '<tr'+cls+'><th scope="row">'+name+'</th>'+r[2].map(function(v){ return '<td class="num">'+pct(v)+'</td>'; }).join("")+'<td class="num">'+dot(r[3].toFixed(2))+'</td></tr>';
  }).join("");
  return dataTable(L("Representation at each recruitment stage. Public Service Commission staffing audit, sample of processes that closed in 2016-17, published 2021. The survival ratio is appointment share divided by application share; below 1.0 means the group loses representation through the process.","Repr\u00e9sentation \u00e0 chaque \u00e9tape du recrutement. V\u00e9rification de la dotation de la Commission de la fonction publique, \u00e9chantillon de processus clos en 2016-2017, publi\u00e9 en 2021. Le ratio de survie est la part des nominations divis\u00e9e par la part des candidatures; sous 1,0, le groupe perd de la repr\u00e9sentation au fil du processus."), head, rows);
}

function surveyTable(){
  var rows = DATA.Q.map(function(q){
    var code = q[0], neg = q[1] === "neg", label = lang === "fr" ? q[3] : q[2];
    var b = DATA.black[code], e = DATA.all[code];
    return { label: label, neg: neg, b: b, e: e, disadv: neg ? (b - e) : (e - b) };
  }).filter(function(r){ return r.b != null && r.e != null; });
  rows.sort(function(a, b){ return b.disadv - a.disadv; });
  var tr = rows.map(function(r){
    var diff = r.b - r.e, d = Math.round(Math.abs(diff)), worse = r.disadv > 0.0001, labtxt;
    if(d === 0){ labtxt = L("about the same", "\u00e0 peu pr\u00e8s identique"); }
    else if(r.neg){ labtxt = (diff > 0) ? d + L(" pts higher (worse)", " pts de plus (pire)") : d + L(" pts lower (better)", " pts de moins (mieux)"); }
    else { labtxt = (diff > 0) ? d + L(" pts higher (better)", " pts de plus (mieux)") : d + L(" pts lower (worse)", " pts de moins (pire)"); }
    var ql = r.label + (r.neg ? L(" (% who experienced it)", " (% l'ayant v\u00e9cu)") : "");
    return '<tr><th scope="row">'+ql+'</th><td class="num'+(worse ? " worse" : "")+'">'+pct(r.b)+'</td><td class="num">'+pct(r.e)+'</td><td>'+labtxt+'</td></tr>';
  }).join("");
  var head = '<th scope="col">'+L("Survey question (2024)","Question du sondage (2024)")+'</th>'
    + '<th scope="col" class="num">'+L("Black","Noirs")+'</th>'
    + '<th scope="col" class="num">'+L("All employees","Tous les employ\u00e9s")+'</th>'
    + '<th scope="col">'+L("Difference","\u00c9cart")+'</th>';
  return dataTable(L("2024 Public Service Employee Survey, Black employees compared with all employees, public-service-wide. Sorted to show the largest Black disadvantages first.","Sondage aupr\u00e8s des fonctionnaires f\u00e9d\u00e9raux de 2024, employ\u00e9s noirs compar\u00e9s \u00e0 l'ensemble des employ\u00e9s, \u00e0 l'\u00e9chelle de la fonction publique. Tri\u00e9 pour montrer d'abord les plus grands d\u00e9savantages."), head, tr);
}

function changeTable(){
  var b24 = DATA.black, b22 = DATA.black2022;
  var rows = DATA.Q.map(function(q){
    var code = q[0], neg = q[1] === "neg", label = lang === "fr" ? q[3] : q[2];
    var v22 = b22[code], v24 = b24[code];
    if(v22 == null || v24 == null) return null;
    var change = v24 - v22;                 /* signed change in the reported metric */
    var worseMove = neg ? change : -change; /* positive value means it moved in the less favourable direction */
    return { label: label, neg: neg, v22: v22, v24: v24, change: change, worseMove: worseMove };
  }).filter(Boolean);
  rows.sort(function(a, b){ return b.worseMove - a.worseMove; });
  var tr = rows.map(function(r){
    var d = Math.abs(r.change), worse = r.worseMove > 0.0001, lbl;
    if(d === 0){ lbl = L("no change","aucun changement"); }
    else {
      var dir = r.change > 0 ? L("up ","hausse de ") : L("down ","baisse de ");
      lbl = dir + d + L(" pts","\u00a0pts") + (worse ? L(" (worse)"," (pire)") : L(" (better)"," (mieux)"));
    }
    var ql = r.label + (r.neg ? L(" (% who experienced it)", " (% l'ayant v\u00e9cu)") : "");
    return '<tr><th scope="row">'+ql+'</th><td class="num">'+pct(r.v22)+'</td><td class="num">'+pct(r.v24)+'</td><td>'+lbl+'</td></tr>';
  }).join("");
  var head = '<th scope="col">'+L("Survey question","Question du sondage")+'</th>'
    + '<th scope="col" class="num">'+L("Black 2022","Noirs 2022")+'</th>'
    + '<th scope="col" class="num">'+L("Black 2024","Noirs 2024")+'</th>'
    + '<th scope="col">'+L("Change","Variation")+'</th>';
  return dataTable(L("Black employees, the 2022 survey cycle compared with 2024, public-service-wide, using the same affirmative-response metric. Sorted to show the largest moves in the less favourable direction first.","Employ\u00e9s noirs, le cycle de sondage de 2022 compar\u00e9 \u00e0 2024, \u00e0 l'\u00e9chelle de la fonction publique, selon la m\u00eame mesure de r\u00e9ponses positives. Tri\u00e9 pour montrer d'abord les plus grands mouvements dans le sens le moins favorable."), head, tr);
}

function exLevelTable(){
  var rows = DATA.exlev.labels.map(function(lab, i){
    var v = DATA.exlev.black[i];
    return '<tr><th scope="row">'+lab+'</th><td class="num">'+(v == null ? L("suppressed","supprim\u00e9") : pct(v))+'</td></tr>';
  }).join("");
  var head = '<th scope="col">'+L("Executive level","Niveau de cadre")+'</th><th scope="col" class="num">'+L("Black share","Part noire")+'</th>';
  return dataTable(L("Black share of executives by level, March 31, 2025. \u201cSuppressed\u201d means the count is too small to report.","Part des cadres noirs par niveau, 31 mars 2025. \u00ab Supprim\u00e9 \u00bb signifie que le d\u00e9nombrement est trop faible pour \u00eatre publi\u00e9."), head, rows);
}

function salaryBandTable(){
  var bands = lang === "fr" ? DATA.sal6.bandsFr : DATA.sal6.bands;
  var rows = bands.map(function(lab, i){
    var bk = DATA.sal6.black[i], al = DATA.sal6.all[i], worse = (i >= 3 && bk < al);
    return '<tr><th scope="row">'+lab+'</th><td class="num'+(worse ? " worse" : "")+'">'+pct(bk)+'</td><td class="num">'+pct(al)+'</td></tr>';
  }).join("");
  var head = '<th scope="col">'+L("Salary band","Tranche salariale")+'</th><th scope="col" class="num">'+L("Black","Noirs")+'</th><th scope="col" class="num">'+L("All employees","Tous les employ\u00e9s")+'</th>';
  return dataTable(L("Share of each group across salary bands, March 31, 2025.","R\u00e9partition de chaque groupe par tranche salariale, 31 mars 2025."), head, rows);

function subgroupPayTable(){
  var sg = DATA.sgsal.slice().sort(function(a, b){ return b[2] - a[2]; });
  var rows = sg.map(function(r){
    var cls = r[3] === "black" ? ' class="hl"' : (r[3] === "ref" ? ' class="ref"' : '');
    return '<tr'+cls+'><th scope="row">'+(lang === "fr" ? r[1] : r[0])+'</th><td class="num">'+pct(r[2])+'</td></tr>';
  }).join("");
  var head = '<th scope="col">'+L("Group","Groupe")+'</th><th scope="col" class="num">'+L("Earning $100K and over","Gagnant 100 000 $ et plus")+'</th>';
  return dataTable(L("Share earning $100,000 or more, by racialized subgroup, with reference lines. Black employees are near the bottom of this list.","Part gagnant 100 000 $ ou plus, par sous-groupe racis\u00e9, avec lignes de r\u00e9f\u00e9rence. Les employ\u00e9s noirs se situent pr\u00e8s du bas de cette liste."), head, rows);
}

    "Les chiffres de 2022 proviennent des tableaux de r\u00e9sultats du Sondage aupr\u00e8s des fonctionnaires f\u00e9d\u00e9raux de 2022-2023. Les deux cycles num\u00e9rotent leurs questions diff\u00e9remment; les questions sont donc appari\u00e9es selon leur libell\u00e9, et non selon leur num\u00e9ro. Les deux ann\u00e9es utilisent la m\u00eame mesure de r\u00e9ponses positives; pour les questions sur le harc\u00e8lement et la discrimination, le chiffre est la part ayant d\u00e9clar\u00e9 l'avoir v\u00e9cu."

  /* 8. About */
  H.push('<h2>'+L("About this page","\u00c0 propos de cette page")+'</h2>');
  H.push('<p>'+L(
    "Two kinds of data, kept separate. The 2024 Public Service Employee Survey records what employees reported (perception). Treasury Board employment equity reporting and the Public Service Commission staffing audit record head counts, recruitment, hires, promotions, separations, region, occupation, executive levels, and salary (administrative). They are not interchangeable. Percentages and dollar figures are shown as published; suppressed small counts are not estimated.",
    "Deux types de donn\u00e9es, gard\u00e9s s\u00e9par\u00e9s. Le Sondage aupr\u00e8s des fonctionnaires f\u00e9d\u00e9raux de 2024 consigne ce que les employ\u00e9s ont d\u00e9clar\u00e9 (perception). La d\u00e9claration sur l'\u00e9quit\u00e9 en emploi du Conseil du Tr\u00e9sor et la v\u00e9rification de la dotation de la Commission de la fonction publique consignent les d\u00e9nombrements, le recrutement, les embauches, les promotions, les d\u00e9parts, la r\u00e9gion, la profession, les niveaux de cadres et les salaires (donn\u00e9es administratives). Ces sources ne sont pas interchangeables. Les pourcentages et les montants en dollars sont pr\u00e9sent\u00e9s tels que publi\u00e9s; les petits d\u00e9nombrements supprim\u00e9s ne sont pas estim\u00e9s."
  )+'</p>');

  document.getElementById("content").innerHTML = H.join("");
  document.getElementById("foot").innerHTML =
      '<p class="src">'+L(
        "Sources: Public Service Employee Survey, 2024 and 2022-2023 results tables (perception). Employment equity reporting, Treasury Board of Canada Secretariat: representation, flows, region, occupation and bilingual data to 2024-25, executive counts at March 31, 2025, median salary 2017-2024. Recruitment funnel: Public Service Commission staffing audit (2016-17 processes, published 2021). Workplace barriers: Canadian Human Rights Commission horizontal audit, 2024.",
        "Sources : Sondage aupr\u00e8s des fonctionnaires f\u00e9d\u00e9raux, 2024 et tableaux de r\u00e9sultats de 2022-2023 (perception). D\u00e9claration sur l'\u00e9quit\u00e9 en emploi, Secr\u00e9tariat du Conseil du Tr\u00e9sor du Canada : repr\u00e9sentation, mouvements, r\u00e9gion, profession et donn\u00e9es sur le bilinguisme jusqu'en 2024-2025, d\u00e9nombrements de cadres au 31 mars 2025, salaire m\u00e9dian 2017-2024. Entonnoir de recrutement : v\u00e9rification de la dotation de la Commission de la fonction publique (processus de 2016-2017, publi\u00e9 en 2021). Obstacles en milieu de travail : v\u00e9rification horizontale de la Commission canadienne des droits de la personne, 2024."
      )+'</p>'
    + '<p class="src">Black employees \u00b7 '+L("standalone page","page autonome")+' \u00b7 Build 2026-06-29b</p>';
}

/* ---- accessibility controls ---- */
function applyTheme(t){
  if(t === "dark" || t === "contrast") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  [["light","thLight"],["dark","thDark"],["contrast","thContrast"]].forEach(function(p){
    var el = document.getElementById(p[1]); if(el) el.setAttribute("aria-pressed", t === p[0] ? "true" : "false");
  });
}
function applyText(scale){
  root.style.fontSize = (parseFloat(scale) * 100) + "%";
  var std = document.getElementById("txStd"), lg = document.getElementById("txLg");
  if(std) std.setAttribute("aria-pressed", parseFloat(scale) === 1 ? "true" : "false");
  if(lg) lg.setAttribute("aria-pressed", parseFloat(scale) !== 1 ? "true" : "false");
}
document.getElementById("enBtn").addEventListener("click", function(){ lang = "en"; render(); });
document.getElementById("frBtn").addEventListener("click", function(){ lang = "fr"; render(); });
document.querySelectorAll("[data-theme-set]").forEach(function(btn){ btn.addEventListener("click", function(){ applyTheme(btn.getAttribute("data-theme-set")); }); });
document.querySelectorAll("[data-text-set]").forEach(function(btn){ btn.addEventListener("click", function(){ applyText(btn.getAttribute("data-text-set")); }); });

var startDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
applyTheme(startDark ? "dark" : "light");
render();
</script>
